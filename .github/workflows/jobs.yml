# 의왕의힘 알림 도우미 — 5분마다 Firebase를 확인해 휴대폰 알림을 보냅니다.
name: 알림 도우미
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uiwang-jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Node.js 20 지원 종료(2025-09) → Node 24로 도는 v5 액션과 Node 24 사용
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 준비
        working-directory: jobs
        run: npm install --omit=dev --no-audit --no-fund
      - name: 알림 보내기
        working-directory: jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node run.js
      # 공개 저장소는 60일 동안 변경이 없으면 예약 실행이 멈춥니다. 한 달에 한 번 기록을 남겨 계속 돌게 합니다.
      - name: 한 달에 한 번 기록 남기기
        if: github.event_name == 'schedule'
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat keepalive.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > keepalive.txt
            git config user.name "uiwang-bot"
            git config user.email "uiwang-bot@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive $month"
            git push
          fi
